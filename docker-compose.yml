version: "3.9"

services:
  backend:
    build: .
    image: fraudguard:latest
    container_name: fraudguard-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-meta_learner}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./models:/app/models
      - ./dataset:/app/dataset
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s