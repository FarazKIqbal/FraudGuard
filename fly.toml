# Fly.io configuration for FraudGuard.
# Generated by `fly launch`. Edit with `fly config set`.

app = "fraudguard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_ENV = "production"
  DEFAULT_MODEL = "meta_learner"

[http_service]
  internal_port = 5000
  port = 80
  [http_service.concurrency]
    concurrent_connections = 100

[[services]]
  http_checks = [
    [interval = 10, timeout = 5, path = "/api/health", method = "GET"],
  ]
