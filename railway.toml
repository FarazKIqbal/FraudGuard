[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:${PORT:-5000} --workers ${WEB_CONCURRENCY:-1} --threads ${GUNICORN_THREADS:-2} --timeout ${GUNICORN_TIMEOUT:-120} wsgi:app"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicy = "on-failure"

[[deploy.ports]]
port = 5000
